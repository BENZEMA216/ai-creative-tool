services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ytdlp:
    build:
      context: ./ytdlp-service
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      TEMP_DIR: ${TEMP_DIR}
    volumes:
      - temp-files:/tmp/ai-creative
    # ports removed — ytdlp only accessible via docker network (security)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MOCK_SMS: ${MOCK_SMS}
      MOCK_PAY: ${MOCK_PAY}
      WHISPER_MODE: ${WHISPER_MODE}
      STORAGE: ${STORAGE}
      YTDLP_SERVICE_URL: ${YTDLP_SERVICE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      # WeChat Pay V3 (MOCK_PAY=false 时才会读)
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO}
      WECHAT_PAY_CERT_PATH: ${WECHAT_PAY_CERT_PATH}
      WECHAT_PAY_KEY_PATH: ${WECHAT_PAY_KEY_PATH}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL}
      # Tencent SMS (MOCK_SMS=false 时才会读)
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY}
      TENCENT_SMS_APP_ID: ${TENCENT_SMS_APP_ID}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION}
      # OpenAI (WHISPER_MODE=openai 时才会读)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
      - temp-files:/tmp/ai-creative
      - ./certs:/certs:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ytdlp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    command: sh -c "pnpm prisma migrate deploy && pnpm dev"

volumes:
  postgres-data:
  redis-data:
  temp-files:
